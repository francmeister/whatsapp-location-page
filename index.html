<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Share your location</title>
</head>
<body>
<script>
(async function () {
  // --- config you might change ---
  const CALLBACK_URL = "https://n8n.besthealthsolutionsapps.co.za/webhook/location-callback"; // n8n webhook production url
 // const CALLBACK_URL = "https://aypchatbot.app.n8n.cloud/webhook-test/location-callback"; // n8n webhook development url
  const WHATSAPP_URL = "https://wa.link/6ll0v5"; // your chatbot link
  // -------------------------------

  const params = new URLSearchParams(window.location.search);
  const phone = params.get("phone");

  if (!phone) {
    alert("Missing phone number.");
    window.location.href = WHATSAPP_URL;
    return;
  }

  if (!("geolocation" in navigator)) {
    alert("Geolocation is not supported by your browser.");
    window.location.href = WHATSAPP_URL;
    return;
  }

  async function sendLocation() {
    navigator.geolocation.getCurrentPosition(
      async function (pos) {
        try {
          const payload = {
            phone: phone,
            lat: pos.coords.latitude,
            lng: pos.coords.longitude
          };

          await fetch(CALLBACK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
        } catch (e) {
          // you might log this on the server; for now we just ignore
          console.error("Error sending location:", e);
        } finally {
          // Always go back to the bot, whether send succeeded or not
          window.location.href = WHATSAPP_URL;
        }
      },
      function (err) {
        alert("Could not get your location: " + err.message);
        window.location.href = WHATSAPP_URL;
      },
      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      }
    );
  }

  // If Permissions API is available, check status (helps for "Always allow")
  if (navigator.permissions && navigator.permissions.query) {
    try {
      const result = await navigator.permissions.query({ name: "geolocation" });

      // If state is "granted", browser will not prompt – coordinates return immediately
      // If "prompt" or "denied", calling getCurrentPosition will either show popup or fail
      sendLocation();
    } catch (e) {
      // If Permissions API fails for some reason, just try to get the position
      sendLocation();
    }
  } else {
    // Older browsers: just try
    sendLocation();
  }
})();
</script>
</body>
</html>
